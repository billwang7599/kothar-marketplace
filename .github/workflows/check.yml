name: Check
on:
  pull_request:
  push:
    branches: [main]
  # Daily, so an entry whose repo or release broke after it was merged shows up here.
  schedule:
    - cron: '17 6 * * *'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
